---

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ node_apt_cache_valid_time }}"

- name: Run system upgrades
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: "{{ node_apt_cache_valid_time }}"
    autoremove: true
  when: node_run_system_upgrades | bool

# Each of these installs the whole list in a single apt transaction instead
# of one apt run per package, which is what `with_items` used to do.
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ node_apt_packages }}"
    state: present
  when: node_apt_packages | length > 0

- name: Ensure timezone packages are the latest version
  ansible.builtin.apt:
    name: "{{ node_apt_timezone_packages }}"
    state: latest
  when: node_apt_timezone_packages | length > 0

- name: Ensure security-sensitive packages are the latest version
  ansible.builtin.apt:
    name: "{{ node_apt_vulnerability_packages }}"
    state: latest
  when: node_apt_vulnerability_packages | length > 0
  tags: packages

- name: Ensure backports packages are the latest version
  ansible.builtin.apt:
    name: "{{ item.name }}"
    default_release: "{{ item.backport }}"
    state: latest
  loop: "{{ node_apt_backports_packages }}"

- name: Install debugging packages
  ansible.builtin.apt:
    name: "{{ node_apt_debug_packages }}"
    state: present
  when: node_apt_debug_packages | length > 0

- name: Install build packages
  ansible.builtin.apt:
    name: "{{ node_apt_build_packages }}"
    state: present
  when: node_apt_build_packages | length > 0

- name: Remove needless packages
  ansible.builtin.apt:
    name: "{{ node_apt_needless_packages }}"
    state: absent
    autoremove: true
  when: node_apt_needless_packages | length > 0
