---

- name: Create the journald persistence directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# A drop-in leaves the distro's journald.conf untouched, so a package
# upgrade never produces a .dpkg-dist conflict and the effective settings
# are readable in one place.
- name: Deploy journald configuration
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/99-ansible.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

# journald has to come back before later tasks log through it, so this is
# flushed here rather than at the end of the play.
- name: Apply journald changes now
  ansible.builtin.meta: flush_handlers
